services:
  # ── PostgreSQL ───────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: reportflow_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: reportflow
    ports:
      - "5432:5432"
    volumes:
      - reportflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── ReportFlow Next.js App ────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reportflow_app
    ports:
      - "3000:3000"
    environment:
      # ── Database (required) ──────────────────────────────────────
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/reportflow?schema=public

      # ── NextAuth (AUTH_SECRET is required) ────────────────────────
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — copy .env.example to .env and set it}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # ── Encryption (required) ────────────────────────────────────
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required — copy .env.example to .env and set it}

      # ── AWS S3 (optional — app falls back to local storage if unset) ───
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

      # ── Runtime ──────────────────────────────────────────────────
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  reportflow_pgdata:
